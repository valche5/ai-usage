name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: gitea.valche5.fr/valche5/ai-usage

jobs:
  publish:
    name: Build and push latest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "${REGISTRY_USERNAME}" ] || [ -z "${REGISTRY_TOKEN}" ]; then
            echo "::error::Les secrets Actions du dépôt REGISTRY_USERNAME et REGISTRY_TOKEN sont obligatoires."
            echo "::error::Ce sont des secrets par dépôt : ceux de downloader ne s'appliquent pas ici."
            echo "::error::REGISTRY_TOKEN doit être un PAT Gitea (Packages: Read and Write), pas le mot de passe du compte."
            exit 1
          fi

      - name: Login to Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.valche5.fr
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          provenance: false
